# Eval personas for the realestate site-visit playbook, rebuilt from two real
# call transcripts (House of Hiranandani / Westgate). ground_truth_slots keys are
# the playbook's ACTUAL slot names (name, stay_location, reason_for_looking, ...)
# so slot_accuracy scores correctly — the previous generic set used mismatched
# keys (customer_name/location/family_size) and mis-scored every persona.
# Each persona reproduces a behaviour the real callers exhibited: partial info,
# repeat-on-re-ask, hallucination-correction, mid-call goodbye, language flips.

- name: Harshita
  traits: >-
    Hindi-preferring, answers in short phrases. Shares ONLY her stay location
    (Thane) — never a separate work location; if asked where she works she just
    repeats that she lives in Thane. If the agent re-asks something she already
    answered, she repeats the same answer verbatim rather than adding detail.
    Mildly corrects the agent when it assumes something she never said
    ("I didn't say that").
  goal: Enquire about a 2 BHK for self use in Thane and hear whether it fits.
  max_turns: 14
  opening: "Haan, boliye."
  ground_truth_slots:
    name: Harshita
    preferred_language: Hindi
    stay_location: Thane
    reason_for_looking: Self-use
    configuration: 2 BHK
    family_members: 5

- name: Rohan
  traits: >-
    Cooperative and forthcoming through the pitch and the pricing. Once he hears
    the price he decides it is not for him and clearly ends the call:
    "Then I'm good. Goodbye." After saying goodbye he does NOT answer any further
    questions — the call should end.
  goal: Hear the project details and pricing, then politely end the call.
  max_turns: 12
  opening: "Yes, hello."
  ground_truth_slots:
    name: Rohan
    preferred_language: English
    stay_location: Mumbai
    reason_for_looking: Self-use
    configuration: 2 BHK

- name: Anil
  traits: >-
    Switches between Hindi and English mid-call and gets confused about which
    language was selected ("which language did I select?"). Otherwise willing to
    share details, but slowly and with some back-and-forth over language.
  goal: Enquire about a 3 BHK for investment while flip-flopping on language.
  max_turns: 14
  opening: "Hello ji, haan."
  ground_truth_slots:
    name: Anil
    preferred_language: Hindi
    stay_location: Pune
    reason_for_looking: Investment
    configuration: 3 BHK
    family_members: 4

- name: Priya
  traits: >-
    Cooperative and forthcoming; happy to book a site visit when it is offered.
    The clean happy-path caller.
  goal: Book a site visit for a 2 BHK for self use.
  max_turns: 14
  opening: "Hi, yes, good afternoon."
  ground_truth_slots:
    name: Priya
    preferred_language: English
    stay_location: Thane
    reason_for_looking: Self-use
    configuration: 2 BHK
    family_members: 3
    visit_day: Saturday
    visit_time: 11 AM

- name: Meera
  traits: >-
    Terse and in a hurry; gives short answers and asks to keep it quick — the
    PRESSED FOR TIME caller who should be fast-tracked, not drilled on every slot.
  goal: Get the essentials fast and accept a callback rather than a full booking.
  max_turns: 12
  opening: "Yes? Quickly please."
  ground_truth_slots:
    name: Meera
    preferred_language: English
    stay_location: Navi Mumbai
    reason_for_looking: Investment
    configuration: 1 BHK
    family_members: 2
